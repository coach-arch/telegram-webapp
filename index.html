<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Questionnaires</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; color: var(--tg-theme-text-color, #000); background: var(--tg-theme-bg-color, #fff); }
    .option { display: block; margin-bottom: 12px; font-size: 16px; cursor: pointer; }
    input { transform: scale(1.3); margin-right: 10px; }
    button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; margin-top: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Select Questionnaires to Send:</h3>
  
  <label class="option"><input type="checkbox" value="Onboarding Audit"> Onboarding Audit</label>
  <label class="option"><input type="checkbox" value="Life Audit"> Life Audit</label>
  <label class="option"><input type="checkbox" value="Forum Questionnaire"> Forum Questionnaire</label>
  <label class="option"><input type="checkbox" value="Mid-Term Review"> Mid-Term Review</label>
  <label class="option"><input type="checkbox" value="Final Assessment"> Final Assessment</label>

  <button onclick="submitSelection()">Confirm & Send</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. Extract page_id from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const pageId = urlParams.get('page_id') || null;

    function submitSelection() {
      const selected = [];
      document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
        selected.push(cb.value);
      });

      if (selected.length === 0) {
        alert("Please select at least one questionnaire.");
        return;
      }

      // 2. Include page_id in payload sent back to Telegram/n8n
      tg.sendData(JSON.stringify({ 
        page_id: pageId,
        selected_questionnaires: selected 
      }));
    }
  </script>
</body>
</html>
