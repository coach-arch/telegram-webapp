<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Questionnaires</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      color: var(--tg-theme-text-color, #000000);
      background: var(--tg-theme-bg-color, #ffffff);
    }

    .option {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      transform: scale(1.3);
      margin-right: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h3>Select Questionnaires to Send:</h3>

  <label class="option">
    <input type="checkbox" value="Emotions Based Update"> Emotions Based Update
  </label>
  
  <label class="option">
    <input type="checkbox" value="Forum Guidelines"> Forum Guidelines
  </label>
  
  <label class="option">
    <input type="checkbox" value="Presentation Prep Form"> Presentation Prep Form
  </label>
  
  <label class="option">
    <input type="checkbox" value="Typical Forum Meeting Agenda"> Typical Forum Meeting Agenda
  </label>
  
  <label class="option">
    <input type="checkbox" value="WHAT Coaching Questions"> WHAT Coaching Questions
  </label>

  <button type="button" onclick="submitSelection()">Confirm & Send</button>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // PASTE YOUR N8N WEBHOOK URL HERE
    const N8N_WEBHOOK_URL = "https://adamsses.app.n8n.cloud/webhook/bc29aa4a-2078-486d-85a7-af74f0977a10";

    async function submitSelection() {
      const submitBtn = document.querySelector('button');
      const selected = [];

      document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
        selected.push(cb.value);
      });

      if (selected.length === 0) {
        alert("Please select at least one questionnaire.");
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const pageId = urlParams.get('page_id') || null;

      // Show loading UI
      submitBtn.innerText = "Sending...";
      submitBtn.disabled = true;

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            page_id: pageId,
            selected_questionnaires: selected,
            telegram_user: tg.initDataUnsafe?.user || null
          })
        });

        if (response.ok) {
          alert("Success! Questionnaires submitted.");
          if (tg && tg.close) {
            tg.close();
          }
        } else {
          alert("Failed to submit. Server returned error.");
        }
      } catch (err) {
        alert("Error sending request: " + err.message);
      } finally {
        submitBtn.innerText = "Confirm & Send";
        submitBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
